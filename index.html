<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What to watch next</title>
<meta name="description" content="Picks a random video from my YouTube Watch Later list.">
<style>
  :root {
    --bg: #0b0b0f;
    --card: #15151c;
    --line: #26262f;
    --text: #f2f2f5;
    --muted: #8b8b98;
    --accent: #ff0033;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(60rem 40rem at 50% -10%, #1a1a24 0%, var(--bg) 60%);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 20px;
  }
  header { text-align: center; }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .card {
    width: min(720px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px -30px rgba(0,0,0,.9);
  }
  .thumb {
    display: block;
    position: relative;
    aspect-ratio: 16 / 9;
    background: #0d0d12;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 18px 20px 20px; }
  .title {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 6px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta { color: var(--muted); font-size: 13.5px; margin: 0; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button, a.btn {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #1d1d26;
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s, transform .06s;
  }
  button:hover, a.btn:hover { background: #25252f; border-color: #34343f; }
  button:active, a.btn:active { transform: translateY(1px); }
  .primary { background: var(--accent); border-color: var(--accent); }
  .primary:hover { background: #e6002e; border-color: #e6002e; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; }
  footer a { color: var(--muted); }
  .err { padding: 24px 20px; color: #ff8a9b; font-size: 14px; }
  kbd {
    font: inherit;
    font-size: 11px;
    background: #1d1d26;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 6px;
  }
</style>
</head>
<body>
  <header>
    <h1>What to watch next</h1>
    <p class="sub" id="count">Pick a random video from my Watch Later list.</p>
  </header>

  <main class="card" id="card" aria-live="polite">
    <div class="err">Loading…</div>
  </main>

  <footer>
    Space / → for another &middot; data: <a href="watch_later.json">watch_later.json</a> &middot;
    <a href="https://github.com/PyNAABO/yt-archive">source</a>
  </footer>

<script>
(() => {
  const card = document.getElementById('card');
  const countEl = document.getElementById('count');
  let videos = [];
  let last = -1;

  const dur = (s) => {
    if (!s && s !== 0) return '';
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const mm = h ? String(m).padStart(2, '0') : m;
    return (h ? h + ':' : '') + mm + ':' + String(sec).padStart(2, '0');
  };

  const draw = () => {
    if (!videos.length) return;
    let i;
    do { i = Math.floor(Math.random() * videos.length); } while (videos.length > 1 && i === last);
    last = i;
    const v = videos[i];
    const url = 'https://www.youtube.com/watch?v=' + v.id + '&list=WL';
    const meta = [v.channel, dur(v.duration)].filter(Boolean).join('  ·  ');

    card.innerHTML = `
      <a class="thumb" href="${url}" target="_blank" rel="noopener">
        <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy" width="1280" height="720">
      </a>
      <div class="body">
        <h2 class="title">${esc(v.title || '(untitled)')}</h2>
        <p class="meta">${esc(meta)}</p>
        <div class="actions">
          <a class="btn primary" href="${url}" target="_blank" rel="noopener">Watch on YouTube</a>
          <button id="next" type="button">Another one</button>
        </div>
      </div>`;
    document.getElementById('next').addEventListener('click', draw);
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') {
      e.preventDefault();
      draw();
    }
  });

  fetch('watch_later.json')
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((d) => {
      videos = (d.videos || []).filter((v) => v.id);
      if (!videos.length) throw new Error('empty list');
      countEl.textContent = videos.length + ' videos in Watch Later — pick one.';
      draw();
    })
    .catch((err) => {
      card.innerHTML = '<div class="err">Could not load watch_later.json (' + esc(err.message) + ').</div>';
    });
})();
</script>
</body>
</html>
