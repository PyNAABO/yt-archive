<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Later · what to watch next</title>
<meta name="description" content="One video from my YouTube Watch Later list, picked at random.">
<meta name="theme-color" content="#0d0c0a">
<meta property="og:title" content="Watch Later">
<meta property="og:description" content="One video from my Watch Later list, picked at random.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0c0a'/%3E%3Cpath d='M12.5 9.5l11 6.5-11 6.5z' fill='%23e0a03a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0d0c0a;
    --ink: #ece7dc;
    --muted: #8d8779;
    --line: rgba(236, 231, 220, .12);
    --accent: #e0a03a;
    --r: 4px;
    --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(224, 160, 58, .3); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .shell {
    min-height: 100svh;
    max-width: 1240px;
    margin: 0 auto;
    padding: clamp(18px, 2.6vw, 30px) clamp(16px, 4vw, 48px);
    display: flex;
    flex-direction: column;
  }

  /* one measure: masthead, frame and colophon share the same edges */
  .shell > header,
  .shell > main,
  .shell > footer {
    width: 100%;
    max-width: min(1144px, calc((100svh - 410px) * 16 / 9));
    margin-inline: auto;
  }

  /* masthead */
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 24px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .mark {
    margin: 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 19px;
    line-height: 1.2;
    letter-spacing: .005em;
  }
  .stat {
    margin: 0;
    font-size: 12.5px;
    letter-spacing: .015em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stat b { font-weight: 600; color: var(--ink); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 3.5vh, 44px) 0;
  }
  .pick {
    width: 100%;
  }

  /* the frame */
  .frame {
    display: block;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: var(--r);
    background: #0f0e0b;
    box-shadow: 0 46px 90px -52px #000, 0 10px 24px -18px #000;
  }
  .frame img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform .8s cubic-bezier(.16, 1, .3, 1);
  }
  .frame:hover img { transform: scale(1.025); }
  .len {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 4px 7px;
    border-radius: var(--r);
    background: rgba(8, 7, 5, .84);
    color: rgba(236, 231, 220, .95);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }

  /* caption */
  .caption {
    max-width: 78ch;
    margin-top: clamp(18px, 2.4vw, 28px);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .title {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(21px, 2.7vw, 33px);
    line-height: 1.18;
    letter-spacing: -.012em;
    text-wrap: balance;
  }
  .meta {
    margin: 12px 0 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 0;
    font-size: 13.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .meta span { margin-right: 12px; }
  .meta span + span::before {
    content: "·";
    margin-right: 12px;
    color: rgba(236, 231, 220, .28);
  }
  .meta .ch {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .005em;
    color: var(--ink);
  }

  /* controls */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 13px 19px;
    border: 1px solid transparent;
    border-radius: var(--r);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .005em;
    text-decoration: none;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  .btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: #181206; }
  .btn.primary:hover { background: #f0b256; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { background: rgba(236, 231, 220, .055); border-color: rgba(236, 231, 220, .22); }

  /* colophon */
  .foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 18px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .foot a { color: var(--muted); text-decoration: none; text-underline-offset: 3px; }
  .foot a:hover { color: var(--ink); text-decoration: underline; }
  kbd {
    font-family: inherit;
    font-size: 11px;
    line-height: 1;
    padding: 3px 6px;
    border: 1px solid var(--line);
    border-bottom-color: rgba(236, 231, 220, .24);
    border-radius: var(--r);
    background: rgba(236, 231, 220, .045);
    color: var(--ink);
  }

  /* states */
  .skel {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: var(--r);
    background: #14120e;
  }
  .skel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(236, 231, 220, .05) 50%, transparent 80%);
    animation: sweep 1.7s linear infinite;
  }
  @keyframes sweep {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  .note {
    max-width: 52ch;
    padding: 8px 0 24px;
    font-size: 14.5px;
    color: var(--muted);
  }
  .note p { margin: 0 0 18px; }
  .note strong { font-weight: 500; color: var(--ink); }
  .note .btn { margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .frame img { transition: none; }
    .frame:hover img { transform: none; }
    .skel::after { animation: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <h1 class="mark">Watch Later</h1>
    <p class="stat" id="stat">Reading the list</p>
  </header>

  <main id="stage" aria-live="polite">
    <div class="skel" aria-hidden="true"></div>
  </main>

  <footer class="foot">
    <span><kbd>space</kbd> or <kbd>&rarr;</kbd> for another</span>
    <span><a href="watch_later.json">watch_later.json</a> <span id="stamp"></span></span>
    <span><a href="https://github.com/PyNAABO/yt-archive">source</a></span>
  </footer>
</div>

<noscript>
  <p style="padding:0 24px 24px;color:#8d8779">This page needs JavaScript to read watch_later.json.</p>
</noscript>

<script>
(() => {
  const stage = document.getElementById('stage');
  const stat = document.getElementById('stat');
  const stamp = document.getElementById('stamp');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let list = [];
  let lastId = '';

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const fmtDur = (s) => {
    if (!s) return '';
    s = Math.round(s);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = String(s % 60).padStart(2, '0');
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + sec : m + ':' + sec;
  };

  const fmtViews = (n) => {
    if (!n) return '';
    const short = (v) => String(v).replace(/\.0$/, '');
    if (n >= 1e9) return short((n / 1e9).toFixed(1)) + 'B views';
    if (n >= 1e6) return short((n / 1e6).toFixed(n < 1e7 ? 1 : 0)) + 'M views';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K views';
    return n + ' views';
  };

  const render = (v) => {
    const id = encodeURIComponent(v.id);
    const url = 'https://www.youtube.com/watch?v=' + id + '&list=WL';
    const len = fmtDur(v.duration);
    const facts = [fmtViews(v.view_count)].filter(Boolean);

    stage.innerHTML = `
      <article class="pick">
        <a class="frame" href="${url}" target="_blank" rel="noopener" aria-label="Watch on YouTube: ${esc(v.title || 'video')}">
          <img src="https://i.ytimg.com/vi/${id}/hq720.jpg" alt="" width="1280" height="720" decoding="async">
          ${len ? `<span class="len">${len}</span>` : ''}
        </a>
        <div class="caption">
          <h2 class="title">${esc(v.title || 'Private or removed video')}</h2>
          <p class="meta">
            ${v.channel ? `<span class="ch">${esc(v.channel)}</span>` : ''}
            ${facts.map((f) => `<span>${esc(f)}</span>`).join('')}
          </p>
          <div class="actions">
            <a class="btn primary" href="${url}" target="_blank" rel="noopener">
              Watch on YouTube
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/><path d="M10.5 8H2.5"/></svg>
            </a>
            <button class="btn ghost" id="next" type="button">
              Another
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.9-4.15"/><path d="M13.6 2v3.1h-3.1"/></svg>
            </button>
          </div>
        </div>
      </article>`;

    const img = stage.querySelector('.frame img');
    img.addEventListener('error', () => {
      if (img.dataset.fallback) return;
      img.dataset.fallback = '1';
      img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    });

    document.getElementById('next').addEventListener('click', draw);

    if (!reduce) {
      stage.querySelector('.pick').animate(
        [
          { opacity: 0, transform: 'translateY(12px) scale(.995)', filter: 'blur(8px)' },
          { opacity: 1, transform: 'none', filter: 'blur(0px)' }
        ],
        { duration: 520, easing: 'cubic-bezier(.16, 1, .3, 1)' }
      );
    }
  };

  function draw() {
    if (!list.length) return;
    let v = list[0];
    if (list.length > 1) {
      do { v = list[Math.floor(Math.random() * list.length)]; } while (v.id === lastId);
    }
    lastId = v.id;
    render(v);
  }

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key !== ' ' && e.key !== 'ArrowRight' && e.key !== 'Enter') return;
    if (e.target.closest('a, button, input, select, textarea')) return;
    e.preventDefault();
    draw();
  });

  fetch('watch_later.json', { cache: 'no-cache' })
    .then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then((d) => {
      list = (d.videos || []).filter((v) => v && v.id && !/^\[(Private|Deleted) video\]$/i.test(v.title || ''));
      if (!list.length) {
        stat.textContent = '0 saved';
        stage.innerHTML = '<div class="note"><p>Nothing saved in Watch Later yet.</p></div>';
        return;
      }
      stat.innerHTML = '<b>' + list.length + '</b> saved &middot; one random pick';
      if (d.generated_at) {
        stamp.textContent = '\u00b7 ' + new Date(d.generated_at).toLocaleDateString('en-GB',
          { day: 'numeric', month: 'short', year: 'numeric' });
      }
      draw();
    })
    .catch(() => {
      stat.textContent = 'List unavailable';
      stage.innerHTML = `
        <div class="note">
          <p>Could not load <strong>watch_later.json</strong>. It may be missing from the repo, or the page is
             opened from disk instead of over the web.</p>
          <button class="btn ghost" id="retry" type="button">Try again</button>
        </div>`;
      document.getElementById('retry').addEventListener('click', () => location.reload());
    });
})();
</script>
</body>
</html>
